{% extends "roster/base.html" %}
{% block title %}Log in | Roster Management{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-sm-8 col-md-5 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-4 text-center">Sign in</h1>

        {% if form.errors %}
          <div class="alert alert-danger">Incorrect staff ID or password. Please try again.</div>
        {% endif %}

        <form method="post">
          {% csrf_token %}
          <label for="id_username" class="form-label fw-semibold">Staff ID</label>
          <input type="text" name="username" id="id_username" class="form-control mb-3"
                 placeholder="e.g. guard01" required autofocus>

          <label for="id_password" class="form-label fw-semibold">Password</label>
          <input type="password" name="password" id="id_password" class="form-control mb-4" required>

          <input type="hidden" name="next" value="{{ next }}">
          <button type="submit" class="btn btn-brand w-100">Log in</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
